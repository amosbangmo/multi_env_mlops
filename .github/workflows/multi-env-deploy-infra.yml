name: "[Multi-Env MLOps] Deploy Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (or shared for the ML Registry)'
        required: true
        type: choice
        options:
          - shared
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  BICEP_DIR: infra
  PROJECT: readmit

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Export workflow inputs
        run: |
          echo "TARGET_ENV=${{ inputs.environment }}" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name "rg-${PROJECT}-${TARGET_ENV}" \
            --location swedencentral \
            --tags project=${PROJECT} environment=${TARGET_ENV} managedBy=bicep

      - name: Bicep Lint
        run: |
          if [ "$TARGET_ENV" = "shared" ]; then
            az bicep build --file "${BICEP_DIR}/shared.bicep"
          else
            az bicep build --file "${BICEP_DIR}/main.bicep"
          fi

      - name: What-If
        run: |
          if [ "$TARGET_ENV" = "shared" ]; then
            az deployment group what-if \
              --resource-group "rg-${PROJECT}-shared" \
              --template-file "${BICEP_DIR}/shared.bicep" \
              --parameters "${BICEP_DIR}/parameters/shared.bicepparam"
          else
            WS_TS=$(date -u +%H%M%S)
            az deployment group what-if \
              --resource-group "rg-${PROJECT}-${TARGET_ENV}" \
              --template-file "${BICEP_DIR}/main.bicep" \
              --parameters "${BICEP_DIR}/parameters/${TARGET_ENV}.bicepparam" \
              --parameters workspaceNameSuffix="$WS_TS" \
              --parameters keyVaultNameSuffix="$RUN_NUMBER"
          fi

  deploy:
    name: Deploy ${{ inputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Export workflow inputs
        run: |
          echo "TARGET_ENV=${{ inputs.environment }}" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install ML Extension
        run: az extension add -n ml --yes

      - name: Get Registry ID
        if: inputs.environment != 'shared'
        id: registry
        run: |
          REGISTRY_ID=$(az ml registry show \
            --name ${PROJECT}-registry \
            --resource-group rg-${PROJECT}-shared \
            --query id -o tsv 2>/dev/null || echo "")
          echo "registry_id=$REGISTRY_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        id: deploy
        run: |
          if [ "$TARGET_ENV" = "shared" ]; then
            az deployment group create \
              --resource-group "rg-${PROJECT}-shared" \
              --template-file "${BICEP_DIR}/shared.bicep" \
              --parameters "${BICEP_DIR}/parameters/shared.bicepparam" \
              --name "deploy-shared-${RUN_NUMBER}"
          else
            # Capture the actual deployed workspace name from Bicep outputs.
            WS_TS=$(date -u +%H%M%S)
            WORKSPACE_NAME=$(az deployment group create \
              --resource-group "rg-${PROJECT}-${TARGET_ENV}" \
              --template-file "${BICEP_DIR}/main.bicep" \
              --parameters "${BICEP_DIR}/parameters/${TARGET_ENV}.bicepparam" \
              --parameters workspaceNameSuffix="$WS_TS" \
              --parameters keyVaultNameSuffix="$RUN_NUMBER" \
              --parameters mlRegistryId='${{ steps.registry.outputs.registry_id }}' \
              --name "deploy-${TARGET_ENV}-${RUN_NUMBER}" \
              --query properties.outputs.workspaceName.value \
              -o tsv)
            echo "workspace_name=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Set identity datastore auth
        if: inputs.environment != 'shared'
        run: |
          # Use the deployed name (includes suffix) instead of a hardcoded convention.
          az ml workspace update \
            --name '${{ steps.deploy.outputs.workspace_name }}' \
            --resource-group "rg-${PROJECT}-${TARGET_ENV}" \
            --system-datastores-auth-mode identity

      - name: Deploy Endpoint Subscription Roles (prod only)
        if: inputs.environment == 'prod'
        run: |
          UAMI_PRINCIPAL_ID=$(az identity show \
            --name "${PROJECT}-endpoint-identity" \
            --resource-group "rg-${PROJECT}-prod" \
            --query principalId -o tsv)

          az deployment sub create \
            --location swedencentral \
            --template-file "${BICEP_DIR}/endpoint-sub-roles.bicep" \
            --parameters endpointPrincipalId="$UAMI_PRINCIPAL_ID" \
            --name "endpoint-sub-roles-${RUN_NUMBER}"
